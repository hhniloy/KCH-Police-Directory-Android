name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.0"
    
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
        echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
    
    - name: Build Release APK
      run: gradle assembleRelease --stacktrace
    
    - name: Get Version Name
      id: version
      run: |
        VERSION=$(grep versionName app/build.gradle | sed 's/.*versionName "\(.*\)"/\1/' | tr -d ' ')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/KCH-Police-Directory-v${{ steps.version.outputs.version }}.apk
    
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: KCH Police Directory v${{ steps.version.outputs.version }}
        body: |
          ## KCH Police Directory v${{ steps.version.outputs.version }}
          
          ### ডাউনলোড করুন:
          নিচের APK file টি download করে install করুন।
          
          ### ইনস্টল করার নিয়ম:
          1. APK file download করুন
          2. Install করুন
          3. "Unknown sources" allow করুন যদি চায়
        files: app/build/outputs/apk/release/KCH-Police-Directory-v${{ steps.version.outputs.version }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload APK as Artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: KCH-Police-Directory-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
