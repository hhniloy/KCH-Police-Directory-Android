name: Build Android APK

# This workflow builds your Android app whenever you push code or manually trigger it
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Download your code from GitHub
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Step 2: Set up Java (required to build Android apps)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    # Step 3: Give permission to gradlew script
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    # Step 4: Decode and prepare keystore if secrets are configured
    - name: Decode Keystore
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
        echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
    
    # Step 5: Build the release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
    
    # Step 6: Upload the APK so you can download it
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KCH-Police-Directory-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
